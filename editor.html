<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Brain-Bot Editor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #101015;
      --gutter-bg: #16161e;
      --gutter-text: #565f89;
      --text: #c0caf5;
      --accent: #7aa2f7;
      --border: #292e42;
      --selection: #283457;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 10px 16px;
      background-color: var(--gutter-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .title {
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    .stats {
      font-size: 12px;
      color: var(--gutter-text);
    }

    .editor-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      background-color: var(--bg);
    }

    .line-numbers {
      width: 44px;
      padding: 12px 6px 12px 0;
      background-color: var(--gutter-bg);
      border-right: 1px solid var(--border);
      color: var(--gutter-text);
      font-family: "JetBrains Mono", Consolas, Menlo, Monaco, monospace;
      font-size: 14px;
      line-height: 20px;
      text-align: right;
      user-select: none;
      overflow: hidden;
      white-space: pre-line;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: "JetBrains Mono", Consolas, Menlo, Monaco, monospace;
      font-size: 14px;
      line-height: 20px;
      padding: 12px 14px;
      resize: none;
      overflow-y: auto;
      white-space: pre;
      word-wrap: normal;
      tab-size: 2;
    }

    textarea::selection {
      background-color: var(--selection);
    }

    footer {
      padding: 8px 16px;
      background-color: var(--gutter-bg);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .btn-save {
      background-color: var(--accent);
      color: #1a1b26;
      font-weight: 600;
    }

    .btn-cancel {
      background-color: var(--border);
      color: var(--text);
    }

    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f2335;
      color: #9ece6a;
      border: 1px solid #414868;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="title" id="docTitle">Редактор</div>
    <div class="stats" id="stats">0 строк, 0 симв.</div>
  </header>

  <div class="editor-container">
    <div class="line-numbers" id="lineNumbers">1</div>
    <textarea id="editor" spellcheck="false" placeholder="Введите текст..."></textarea>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    <button class="btn-cancel" onclick="closeEditor()">Закрыть</button>
    <button class="btn-save" onclick="saveContent()">💾 Сохранить</button>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.MainButton) {
        tg.MainButton.setText("💾 Сохранить");
        tg.MainButton.show();
        tg.MainButton.onClick(saveContent);
        // Скрываем дублирующий HTML-футер в Telegram — используется нативный MainButton
        const footer = document.querySelector("footer");
        if (footer) footer.style.display = "none";
      }
      if (tg.BackButton) {
        tg.BackButton.show();
        tg.BackButton.onClick(closeEditor);
      }
    }

    const editor = document.getElementById("editor");
    const lineNumbers = document.getElementById("lineNumbers");
    const stats = document.getElementById("stats");
    const docTitle = document.getElementById("docTitle");

    let payload = {
      target_type: "unknown",
      target_id: 0,
      title: "Заметка",
      text: ""
    };

    function initData() {
      try {
        let rawData = null;

        // 1. Проверяем query string ?data=...
        const searchParams = new URLSearchParams(window.location.search);
        if (searchParams.has("data")) {
          rawData = searchParams.get("data");
        }

        // 2. Фолбэк на hash #data=...
        if (!rawData && window.location.hash) {
          const hashStr = window.location.hash.substring(1);
          const hashParams = new URLSearchParams(hashStr);
          if (hashParams.has("data")) {
            rawData = hashParams.get("data");
          }
        }

        if (rawData) {
          try {
            payload = JSON.parse(decodeURIComponent(rawData));
          } catch (e1) {
            try {
              const cleaned = rawData.replace(/ /g, "+");
              const decoded = decodeURIComponent(escape(atob(cleaned)));
              payload = JSON.parse(decoded);
            } catch (e2) {
              console.error("Failed to parse data payload:", e1, e2);
            }
          }
        }
      } catch (e) {
        console.error("Error parsing init data:", e);
      }

      if (payload.title) {
        docTitle.innerText = payload.title;
      }
      editor.value = payload.text || "";
      updateEditor();
    }

    function updateEditor() {
      const text = editor.value;
      const lines = text.split("\n").length;
      
      let numbers = "";
      for (let i = 1; i <= lines; i++) {
        numbers += i + "\n";
      }
      lineNumbers.innerText = numbers;
      stats.innerText = lines + " строк, " + text.length + " симв.";
    }

    editor.addEventListener("input", updateEditor);
    editor.addEventListener("scroll", () => {
      lineNumbers.scrollTop = editor.scrollTop;
    });

    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.innerText = message;
      toast.style.color = isError ? "#f7768e" : "#9ece6a";
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2500);
    }

    function saveContent() {
      const updatedText = editor.value;
      const resultData = {
        action: "save_init",
        target_type: payload.target_type,
        target_id: payload.target_id,
        text: updatedText
      };

      if (tg) {
        if (tg.HapticFeedback) {
          tg.HapticFeedback.notificationOccurred("success");
        }
        showToast("✓ Сохранено! Отправка в бот...");
        if (tg.sendData) {
          setTimeout(() => {
            tg.sendData(JSON.stringify(resultData));
          }, 350);
          return;
        }
      }
      showToast("✓ Изменения сохранены (предпросмотр)");
    }

    function closeEditor() {
      if (tg && tg.close) {
        tg.close();
      } else {
        window.close();
      }
    }

    window.addEventListener("DOMContentLoaded", initData);
  </script>
</body>
</html>
