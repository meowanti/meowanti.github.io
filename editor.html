<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Brain-Bot Editor</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #101015;
      --gutter-bg: #16161e;
      --gutter-text: #565f89;
      --text: #c0caf5;
      --accent: #7aa2f7;
      --border: #292e42;
      --selection: #283457;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      padding: 10px 16px;
      background-color: var(--gutter-bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }

    .title {
      font-weight: 600;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 70%;
    }

    .stats {
      font-size: 12px;
      color: var(--gutter-text);
    }

    .editor-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
      background-color: var(--bg);
    }

    .line-numbers {
      width: 44px;
      padding: 12px 6px 12px 0;
      background-color: var(--gutter-bg);
      border-right: 1px solid var(--border);
      color: var(--gutter-text);
      font-family: "JetBrains Mono", Consolas, Menlo, Monaco, monospace;
      font-size: 14px;
      line-height: 20px;
      text-align: right;
      user-select: none;
      overflow: hidden;
      white-space: pre-line;
    }

    .line-numbers div {
      overflow: hidden;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: "JetBrains Mono", Consolas, Menlo, Monaco, monospace;
      font-size: 14px;
      line-height: 20px;
      padding: 12px 14px;
      resize: none;
      overflow-x: hidden;
      overflow-y: auto;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      tab-size: 2;
    }

    #lineMeasurer {
      position: absolute;
      visibility: hidden;
      pointer-events: none;
      top: -9999px;
      left: -9999px;
      margin: 0;
      padding: 0;
      border: none;
      font-family: "JetBrains Mono", Consolas, Menlo, Monaco, monospace;
      font-size: 14px;
      line-height: 20px;
      tab-size: 2;
      box-sizing: content-box;
    }

    #lineMeasurer .m-line {
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      margin: 0;
      padding: 0;
      min-height: 20px;
      line-height: 20px;
    }

    textarea::selection {
      background-color: var(--selection);
    }

    footer {
      display: none;
      padding: 8px 16px;
      background-color: var(--gutter-bg);
      border-top: 1px solid var(--border);
      justify-content: flex-end;
      gap: 10px;
    }

    body.no-tg footer {
      display: flex;
    }

    button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:active {
      opacity: 0.8;
    }

    .btn-save {
      background-color: var(--accent);
      color: #1a1b26;
      font-weight: 600;
    }

    .btn-cancel {
      background-color: var(--border);
      color: var(--text);
    }

    .toast {
      position: fixed;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #1f2335;
      color: #9ece6a;
      border: 1px solid #414868;
      border-radius: 20px;
      padding: 8px 18px;
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <header>
    <div class="title" id="docTitle">Редактор</div>
    <div class="stats" id="stats">0 строк, 0 симв.</div>
  </header>
  <div class="meta-bar" id="metaBar" style="display:none; padding: 4px 16px; background-color: #16161e; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--gutter-text); gap: 12px; align-items: center;"></div>

  <div class="editor-container">
    <div class="line-numbers" id="lineNumbers">1</div>
    <textarea id="editor" spellcheck="false" placeholder="Введите текст..."></textarea>
  </div>
  <div id="lineMeasurer" aria-hidden="true"></div>

  <div class="toast" id="toast"></div>

  <footer>
    <button class="btn-cancel" onclick="closeEditor()">Закрыть</button>
    <button class="btn-save" onclick="saveContent()">💾 Сохранить</button>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;
    const isInsideTelegram = !!(tg && (tg.initData || (tg.platform && tg.platform !== "unknown")));

    if (isInsideTelegram && tg) {
      try {
        tg.ready();
        tg.expand();
        if (tg.MainButton) {
          tg.MainButton.setText("💾 Сохранить");
          tg.MainButton.show();
          tg.MainButton.onClick(saveContent);
        }
        if (tg.BackButton) {
          tg.BackButton.show();
          tg.BackButton.onClick(closeEditor);
        }
      } catch (e) {
        console.error("TG WebApp init error:", e);
      }
    } else {
      document.body.classList.add("no-tg");
    }

    const editor = document.getElementById("editor");
    const lineNumbers = document.getElementById("lineNumbers");
    const stats = document.getElementById("stats");
    const docTitle = document.getElementById("docTitle");
    const lineMeasurer = document.getElementById("lineMeasurer");

    let payload = {
      target_type: "unknown",
      target_id: 0,
      title: "Заметка",
      text: ""
    };

    function parseData(raw) {
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (e) {}

      try {
        return JSON.parse(decodeURIComponent(raw));
      } catch (e) {}

      try {
        const cleaned = raw.replace(/ /g, "+");
        const binary = atob(cleaned);
        const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
        return JSON.parse(new TextDecoder("utf-8").decode(bytes));
      } catch (e) {}

      try {
        const cleaned = raw.replace(/ /g, "+");
        return JSON.parse(decodeURIComponent(escape(atob(cleaned))));
      } catch (e) {}

      return null;
    }

    function initData() {
      try {
        let rawData = null;

        // 1. Проверяем query string ?data=...
        const searchParams = new URLSearchParams(window.location.search);
        if (searchParams.has("data")) {
          rawData = searchParams.get("data");
        }

        // 2. Фолбэк на hash #data=... или внутри фрагмента tgWebAppData
        if (!rawData && window.location.hash) {
          const hashStr = window.location.hash.substring(1);
          const hashParams = new URLSearchParams(hashStr);
          if (hashParams.has("data")) {
            rawData = hashParams.get("data");
          }
        }

        if (rawData) {
          const parsed = parseData(rawData);
          if (parsed && typeof parsed === "object") {
            payload = { ...payload, ...parsed };
          }
        }
      } catch (e) {
        console.error("Error parsing init data:", e);
      }

      if (payload.title) {
        docTitle.innerText = payload.title;
      }
      if (payload.metadata) {
        const metaBar = document.getElementById("metaBar");
        if (metaBar) {
          const parts = [];
          if (payload.metadata.direction) {
            parts.push(`📁 ${payload.metadata.direction}`);
          }
          if (payload.metadata.created_at) {
            parts.push(`📅 ${payload.metadata.created_at}`);
          }
          if (payload.metadata.links_count !== undefined) {
            parts.push(`🔗 Связей: ${payload.metadata.links_count}`);
          }
          if (parts.length > 0) {
            metaBar.innerHTML = parts.join("&nbsp;&nbsp;•&nbsp;&nbsp;");
            metaBar.style.display = "flex";
          }
        }
      }
      editor.value = payload.text || "";
      updateEditor();
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function updateEditor() {
      const text = editor.value;
      const lines = text.split("\n");
      const lineCount = lines.length;
      stats.innerText = lineCount + " строк, " + text.length + " симв.";

      const style = window.getComputedStyle(editor);
      const padLeft = parseFloat(style.paddingLeft) || 14;
      const padRight = parseFloat(style.paddingRight) || 14;
      const contentWidth = editor.clientWidth ? (editor.clientWidth - padLeft - padRight) : 0;

      if (contentWidth > 0 && lineMeasurer) {
        lineMeasurer.style.width = contentWidth + "px";

        let measureHtml = "";
        for (let i = 0; i < lineCount; i++) {
          const escaped = escapeHtml(lines[i]);
          measureHtml += `<div class="m-line">${escaped || "&#8203;"}</div>`;
        }
        lineMeasurer.innerHTML = measureHtml;

        const children = lineMeasurer.children;
        let numHtml = "";
        for (let i = 0; i < lineCount; i++) {
          const h = children[i].offsetHeight;
          numHtml += `<div style="height:${h}px;line-height:20px;">${i + 1}</div>`;
        }
        lineNumbers.innerHTML = numHtml;
      } else {
        let numbers = "";
        for (let i = 1; i <= lineCount; i++) {
          numbers += i + "\n";
        }
        lineNumbers.innerText = numbers;
      }
    }

    editor.addEventListener("input", updateEditor);
    editor.addEventListener("scroll", () => {
      lineNumbers.scrollTop = editor.scrollTop;
    });
    window.addEventListener("resize", updateEditor);
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updateEditor);
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById("toast");
      if (!toast) return;
      toast.innerText = message;
      toast.style.color = isError ? "#f7768e" : "#9ece6a";
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2800);
    }

    function saveContent() {
      const updatedText = editor.value;
      const resultData = {
        action: payload.target_type === "thought" ? "save_thought" : "save_init",
        target_type: payload.target_type,
        target_id: payload.target_id,
        text: updatedText
      };

      if (tg && tg.HapticFeedback) {
        try {
          tg.HapticFeedback.notificationOccurred("success");
        } catch (e) {}
      }

      let sent = false;
      if (tg && typeof tg.sendData === "function") {
        try {
          tg.sendData(JSON.stringify(resultData));
          sent = true;
        } catch (err) {
          console.warn("tg.sendData error (e.g. inline webview):", err);
          sent = false;
        }
      }

      if (sent) {
        showToast("✓ Сохранено! Отправка в бот...");
        setTimeout(() => closeEditor(), 400);
      } else {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(updatedText).then(() => {
            showToast("✓ Скопировано в буфер! Отправьте текст в чат.");
          }).catch(() => {
            showToast("✓ Скопируйте текст и отправьте в чат.");
          });
        } else {
          showToast("✓ Скопируйте текст и отправьте в чат.");
        }
      }
    }

    function closeEditor() {
      if (tg && tg.close) {
        try {
          tg.close();
        } catch (e) {
          window.close();
        }
      } else {
        window.close();
      }
    }

    window.addEventListener("DOMContentLoaded", initData);
  </script>
</body>
</html>
